<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment Failed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="card p-4 shadow-sm">
    <h3 class="text-danger mb-3">❌ Payment Failed!</h3>
    <p>Please check your transaction details and try again.</p>
    <hr>
    <h5>Student Details</h5>
    <p><strong>Name:</strong> <span id="studentName"></span></p>
    <p><strong>Hall Ticket:</strong> <span id="hallTicket"></span></p>
    <p><strong>Email:</strong> <span id="email"></span></p>
    <p><strong>Phone:</strong> <span id="phone"></span></p>

    <div class="text-center mt-4">
      <a href="payment.html" class="btn btn-warning">Retry Payment</a>
    </div>
  </div>
</div>

<script>
document.getElementById('studentName').innerText = localStorage.getItem('studentName') || 'N/A';
document.getElementById('hallTicket').innerText = localStorage.getItem('hallTicket') || 'N/A';
document.getElementById('email').innerText = localStorage.getItem('email') || 'N/A';
document.getElementById('phone').innerText = localStorage.getItem('phone') || 'N/A';
</script>

</body>
</html>
