<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exam Application - University Exam App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    // Function to preview photo
    function previewPhoto() {
      var photo = document.getElementById('photo').files[0];
      var preview = document.getElementById('photoPreview');

      if (photo) {
        var reader = new FileReader();
        reader.onload = function (e) {
          preview.src = e.target.result;
          preview.style.display = 'block'; // Show the image
        }
        reader.readAsDataURL(photo); // Read file as base64 URL
      } else {
        preview.src = "";
        preview.style.display = 'none'; // Hide if no photo
      }
    }

    // Function to validate form and handle the exam type
    function validateForm(event) {
      event.preventDefault(); // Prevent form submission so we can handle it with JavaScript

      // Get form inputs
      var hallTicket = document.getElementById('hallTicket').value;
      var phone = document.getElementById('phone').value;
      var email = document.getElementById('email').value;
      var examType = document.querySelector('input[name="examType"]:checked');
      var semester = document.getElementById('semester').value;
      var photo = document.getElementById('photo').files[0];

      // Validate Hall Ticket (exactly 10 characters, letters and digits)
      var hallTicketRegex = /^[a-zA-Z0-9]{10}$/;
      if (!hallTicketRegex.test(hallTicket)) {
        alert("Hall Ticket Number must be exactly 10 characters long and can only contain letters and digits.");
        return false;
      }

      // Validate Phone Number (exactly 10 digits)
      if (phone.length != 10 || isNaN(phone)) {
        alert("Phone Number must be exactly 10 digits.");
        return false;
      }

      // Validate Email
      var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        alert("Please enter a valid Email address.");
        return false;
      }

      // Validate Exam Type
      if (!examType) {
        alert("Please select an exam type (Regular or Supply).");
        return false;
      }

      // Validate Photo
      if (!photo) {
        alert("Please upload your passport size photo.");
        return false;
      }

      // Store form data in localStorage
      localStorage.setItem("studentName", document.getElementById('studentName').value);
      localStorage.setItem("hallTicket", hallTicket);
      localStorage.setItem("email", email);
      localStorage.setItem("course", document.getElementById('course').value);
      localStorage.setItem("branch", document.getElementById('branch').value);
      localStorage.setItem("year", document.getElementById('year').value);
      localStorage.setItem("semester", semester);
      localStorage.setItem("phone", phone);
      localStorage.setItem("examType", examType.value);

      // Also store photo in base64 format (optional if needed in preview page)
      var reader = new FileReader();
      reader.onload = function (e) {
        localStorage.setItem("photo", e.target.result);

        // Redirect after photo is saved
        if (examType.value === "Regular") {
          window.location.href = "subject_selection.html?examType=Regular";
        } else {
          if (!semester) {
            alert("Please select a semester for Supply exams.");
            return false;
          }
          window.location.href = "subject_selection.html?examType=Supply&semester=" + semester;
        }
      }
      reader.readAsDataURL(photo); // Read photo as base64 and store
    }
  </script>
</head>

<body class="bg-light">

<div class="container mt-5">
  <h3 class="mb-4">Exam Application Form</h3>
  <form onsubmit="validateForm(event)">
    
    <!-- Student Name -->
    <div class="mb-3">
      <label for="studentName" class="form-label">Student Name</label>
      <input type="text" class="form-control" id="studentName" placeholder="Enter your name" required>
    </div>

    <!-- Hall Ticket -->
    <div class="mb-3">
      <label for="hallTicket" class="form-label">Hall Ticket Number</label>
      <input type="text" class="form-control" id="hallTicket" placeholder="Enter Hall Ticket Number" required maxlength="10" minlength="10">
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label for="email" class="form-label">Email Address</label>
      <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
    </div>

    <!-- Upload Photo -->
    <div class="mb-3">
      <label for="photo" class="form-label">Upload Passport Size Photo</label>
      <input type="file" class="form-control" id="photo" accept="image/*" onchange="previewPhoto()" required>
    </div>

    <!-- Photo Preview -->
    <div class="mb-3">
      <img id="photoPreview" src="" alt="Photo Preview" style="display:none; max-width: 150px; max-height: 150px; border: 1px solid #ccc; margin-top:10px;">
    </div>

    <!-- Course -->
    <div class="mb-3">
      <label for="course" class="form-label">Course</label>
      <select class="form-select" id="course" required>
        <option selected disabled>Choose...</option>
        <option>B.Tech</option>
        <option>B.Com</option>
        <option>MCA</option>
        <option>M.Tech</option>
      </select>
    </div>

    <!-- Branch -->
    <div class="mb-3">
      <label for="branch" class="form-label">Branch</label>
      <select class="form-select" id="branch" required>
        <option selected disabled>Choose...</option>
        <option>CSE</option>
        <option>ECE</option>
        <option>EEE</option>
        <option>MECH</option>
        <option>CIVIL</option>
      </select>
    </div>

    <!-- Year and Semester -->
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="year" class="form-label">Year</label>
        <select class="form-select" id="year" required>
          <option selected disabled>Choose...</option>
          <option>1st Year</option>
          <option>2nd Year</option>
          <option>3rd Year</option>
          <option>4th Year</option>
        </select>
      </div>

      <div class="col-md-6 mb-3" id="semesterField">
        <label for="semester" class="form-label">Semester</label>
        <select class="form-select" id="semester" required>
          <option selected disabled>Choose...</option>
          <option>1st Semester</option>
          <option>2nd Semester</option>
          <option>3rd Semester</option>
          <option>4th Semester</option>
          <option>5th Semester</option>
          <option>6th Semester</option>
          <option>7th Semester</option>
          <option>8th Semester</option>
        </select>
      </div>

      <div class="col-md-6 mb-3">
        <label for="subject selection" class="form-label">subject selection</label>
        <select class="form-select" id="subject selection" required>
          <option selected disabled>Choose...</option>
          <option>computer networks</option>
          <option>PCNS</option>
          <option>software engineering</option>
          <option>Dataware house and data mininig</option>
        </select>
      </div>
    </div>

    <!-- Phone -->
    <div class="mb-3">
      <label for="phone" class="form-label">Phone Number</label>
      <input type="tel" class="form-control" id="phone" placeholder="Enter phone number" required maxlength="10" minlength="10">
    </div>

    <!-- Exam Type -->
    <div class="mb-3">
      <label class="form-label">Type</label><br>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="examType" id="regular" value="Regular" required>
        <label class="form-check-label" for="regular">Regular</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="examType" id="supply" value="Supply" required>
        <label class="form-check-label" for="supply">Supply</label>
      </div>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn btn-success w-100">Continue</button>
    <button class="btn w-100">
      <a href="previw.html" style="display:block; color:#333; text-decoration:none;">Preview</a>
    </button>
  </form>
</div>
</div>
    


</body>
</html>
