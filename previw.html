<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exam Application Preview</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    // Load student data from localStorage and display
    window.onload = function() {
      document.getElementById('studentName').innerText = localStorage.getItem('studentName') || '-';
      document.getElementById('hallTicket').innerText = localStorage.getItem('hallTicket') || '-';
      document.getElementById('email').innerText = localStorage.getItem('email') || '-';
      document.getElementById('phone').innerText = localStorage.getItem('phone') || '-';
      document.getElementById('course').innerText = localStorage.getItem('course') || '-';
      document.getElementById('branch').innerText = localStorage.getItem('branch') || '-';
      document.getElementById('year').innerText = localStorage.getItem('year') || '-';
      document.getElementById('semester').innerText = localStorage.getItem('semester') || '-';
      document.getElementById('examType').innerText = localStorage.getItem('examType') || '-';

      // Load and display photo
      var photoData = localStorage.getItem('photo');
      if (photoData) {
        document.getElementById('photoPreview').src = photoData;
      }

      // Load Subjects Based on Exam Type
      const urlParams = new URLSearchParams(window.location.search);
      const examType = urlParams.get('examType');
      if (examType === "Regular") {
        loadRegularSubjects();
      } else {
        loadSupplySubjects();
      }
    };

    // Dummy subjects list
    const subjectsList = {
      "1st Semester": ["Maths-I", "Physics", "Chemistry", "C Programming", "Engineering Graphics"],
      "2nd Semester": ["Maths-II", "Basic Electrical Engineering", "English", "Data Structures", "Environmental Science"],
      // Add more semesters if needed
    };

    function loadRegularSubjects() {
      const semester = localStorage.getItem('semester');
      const subjects = subjectsList[semester] || [];

      var subjectListHTML = '';
      subjects.forEach((subject, index) => {
        subjectListHTML += `<li class="list-group-item">${subject}</li>`;
      });

      document.getElementById('subjects').innerHTML = subjectListHTML || '<li class="list-group-item">Subjects not available for selected semester</li>';
    }

    function loadSupplySubjects() {
      // For supply, allow user to select subjects manually (future plan)
      document.getElementById('subjects').innerHTML = '<li class="list-group-item">Selected Subjects (Supply): (To be implemented)</li>';
    }
  </script>
</head>

<body class="bg-light">
<div class="container mt-5">
  <h3 class="mb-4">Application Preview</h3>

  <div class="card mb-4">
    <div class="card-body">
      <div class="row">
        <!-- Student Details -->
        <div class="col-md-8">
          <p><strong>Name:</strong> <span id="studentName"></span></p>
          <p><strong>Hall Ticket:</strong> <span id="hallTicket"></span></p>
          <p><strong>Email:</strong> <span id="email"></span></p>
          <p><strong>Phone:</strong> <span id="phone"></span></p>
          <p><strong>Course:</strong> <span id="course"></span></p>
          <p><strong>Branch:</strong> <span id="branch"></span></p>
          <p><strong>Year:</strong> <span id="year"></span></p>
          <p><strong>Semester:</strong> <span id="semester"></span></p>
          <p><strong>Exam Type:</strong> <span id="examType"></span></p>
        </div>

        <!-- Photo Preview -->
        <div class="col-md-4 text-center">
          <img id="photoPreview" src="" alt="Passport Photo" class="img-thumbnail" style="max-width: 150px; max-height: 150px;">
        </div>
      </div>
    </div>
  </div>

  <!-- Subjects List -->
  <div class="card mb-4">
    <div class="card-body">
      <h5>Subjects</h5>
      <ul class="list-group" id="subjects">
        <!-- Subjects will load here -->
      </ul>
    </div>
  </div>

  <!-- Final Buttons -->
  <div class="d-flex justify-content-between">
    <a href="index.html" class="btn btn-secondary">Edit Details</a>
    <a href="payment.html" class="btn btn-success">Proceed to Payment</a>

  </div>

</div>
</body>
</html>
