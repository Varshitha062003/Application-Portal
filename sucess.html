<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment Success</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="card p-4 shadow-sm">
    <h3 class="text-success mb-3">🎉 Payment Successful!</h3>
    <h5>Student Details</h5>
    <p><strong>Name:</strong> <span id="studentName"></span></p>
    <p><strong>Hall Ticket:</strong> <span id="hallTicket"></span></p>
    <p><strong>Email:</strong> <span id="email"></span></p>
    <p><strong>Phone:</strong> <span id="phone"></span></p>
    <hr>
    <h5>Subjects Registered</h5>
    <ul id="subjectList" class="list-group"></ul>
    <hr>
    <h5>Transaction Details</h5>
    <p><strong>Transaction ID:</strong> <span id="transactionId"></span></p>
  </div>
</div>

<script>
document.getElementById('studentName').innerText = localStorage.getItem('studentName');
document.getElementById('hallTicket').innerText = localStorage.getItem('hallTicket');
document.getElementById('email').innerText = localStorage.getItem('email');
document.getElementById('phone').innerText = localStorage.getItem('phone');
document.getElementById('transactionId').innerText = localStorage.getItem('transactionId');

const subjects = JSON.parse(localStorage.getItem('selectedSubjects') || '[]');
const subjectList = document.getElementById('subjectList');
subjects.forEach(sub => {
  const li = document.createElement('li');
  li.className = 'list-group-item';
  li.innerText = sub;
  subjectList.appendChild(li);
});
</script>

</body>
</html>
